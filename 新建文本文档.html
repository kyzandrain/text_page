<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>精美卡片示例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4edf9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 20px;
    }

    .card {
      width: 360px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08),
        0 4px 12px rgba(0, 0, 0, 0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.12),
        0 6px 16px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      height: 160px;
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .card-body {
      padding: 24px;
      text-align: center;
    }

    .card-body h2 {
      color: #333;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .card-body p {
      color: #666;
      line-height: 1.6;
      font-size: 15px;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: #2575fc;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #1a68e8;
    }

    footer {
      position: absolute;
      bottom: 20px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      🌟 欢迎你
    </div>
    <div class="card-body">
      <h2>探索美好界面</h2>
      <p>这是一个独立的 HTML 文件，无需外部依赖，即可呈现现代、优雅的视觉效果。</p>
      <button class="btn" onclick="alert('你好！这是一个演示按钮 😊')">点击我</button>
    </div>
  </div>

  <footer>
    Made with ❤️ | 纯 HTML + CSS
  </footer>
</body>
</html>
